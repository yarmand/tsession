<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tsession</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <aside id="sessions">
    <ul id="session-list"></ul>
  </aside>
  <main id="terminal-pane">
    <div id="terminal-banner" class="hidden"></div>
    <div id="terminal"></div>
    <div id="empty-state">Select a session to attach.</div>
  </main>
</div>

<div id="rename-modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="rename-modal-title">Rename session</h2>
    <input id="rename-input" type="text" autocomplete="off">
    <div class="modal-actions">
      <button id="rename-cancel">Cancel</button>
      <button id="rename-save">Save</button>
    </div>
    <div id="rename-error" class="error hidden"></div>
  </div>
</div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/app.js"></script>
</body>
</html>
